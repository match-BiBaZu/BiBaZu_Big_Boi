[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibazu-reorientation"
version = "0.1.0"
description = "Supervised BiBaZu part reorientation control"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6>=6.8,<7",
    "bleak>=1.0,<2",
    "genicam>=1.5.1,<2",
    "harvesters>=1.4.3,<2",
    "neewerlite==0.3.3",
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
    "pyads==3.6.0",
    "pyyaml>=6,<7",
    "qasync>=0.27,<1",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "ultralytics==8.4.102",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-qt>=4.4,<5",
    "ruff>=0.12,<1",
]

[project.scripts]
bibazu-reorientation = "bibazu_reorientation.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bibazu_reorientation"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["hardware: requires physical BiBaZu hardware"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

